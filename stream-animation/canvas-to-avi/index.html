<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Record animation to AVI</title>
    <link rel="icon" type="image/png" sizes="128x128" href="favicon128.png">
</head>
<body>
    <div class="toolbar">
        <div>
            <input id="idText1" value="Dynamic column width text layout demo" size="50" onchange="setTexts()" />
            <input id="idText2" value="عرض تخطيط النص بعرض أعمدة ديناميكي" size="50" onchange="setTexts()" />
        </div>
        <button title="Draw Text" onclick="drawText()">Draw text</button>
        <label for="fontzise">Font Size:</label><input type="number" step="8" min=12 max=60 value="24" id="fontsize" />
        <label for="margin">Margin:</label><input type="number" step="0.5" min="0" max="40" value="2.5" id="margin" onchange="setMargin()" />
        <!--<button onclick="clearCanvas()">Clear Canvas</button>-->
        <label for="gAlpha">gAlpha:</label><input type="number" step="0.1" min="0" max="1" value="0.9" id="gAlpha" />
        <label for="strokeLineWidth">Stroke Width:</label><input type="number" step="0.5" min="0" max="12" value="2" id="strokeLineWidth" />
        <button onclick="imageBackground()">Bkg Image</button>
        <label for="canvasbkgColor">Bkg Color:</label>
        <input type="color" id="canvasbkgColor" value=#6a5acd onchange="colorBackground(this.value)">
        <!--<button onclick="downloadCanvasContent()">Download</button>-->
        <button onclick="animateColumnWidth()">Animation</button>
        <label for="idOffline">Offline:</label><input type="checkbox" id="idOffline"/>
    </div>
    <div id="canvasbackground" style="width: 320px; height: 240px; outline: thin solid blue;">
        <canvas id="canvas" width="320" height="240" style="outline: thin solid blue;"></canvas>
    </div>
    <script src="main.js">
    </script>
</body>
</html>
