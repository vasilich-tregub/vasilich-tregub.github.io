<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
        }

        div.container {
            font-size: 250%;
            width: 250px;
            animation: 10s linear 0s infinite alternate dynamic-column-width;
        }

        @keyframes dynamic-column-width {
            from {
                width: 500px;
            }

            to {
                width: 200px;
            }
        }
    </style>
    <meta charset="utf-8" />
    <title>Stream web animation</title>
    <link rel="icon" type="image/png" sizes="128x128" href="favicon128.png">
    <!--script src="stream-animation.js"></!--script-->
</head>
<body>
    <svg width="500" viewBox="0 0 500 500">
        <style type="text/css">
            div.container {
                font-size: 250%;
                width: 250px;
                animation: 10s linear 0s infinite alternate dynamic-column-width;
            }
            @keyframes dynamic-column-width {
                from {
                    width: 500px;
                }
                to {
                    width: 200px;
                }
            }
        </style>
        <foreignObject x="0" y="0" width="500" height="500" style="inline-size:500px;">
            <div class="container">
                <div style="text-align:left;">
                    Dynamic column-width text layout demo
                </div>
                <div style="text-align:right;">
                    عرض توضيلتخطيط النص بعرض أعمدة ديناميكي
                </div>
            </div>
        </foreignObject>
    </svg>
    <canvas id="idCanvas" style="border:2px solid lime;" width="500" height="500"></canvas>
    <script>
        var canvas = document.getElementById('idCanvas');
        var ctx = canvas.getContext('2d');
        var data = '<svg xmlns="http://www.w3.org/2000/svg" width="500" viewBox="0 0 500 500">' + 
            '<style type="text/css">' + 
            'div.container {font-size: 250%; width: 250px; animation: 10s linear 0s infinite alternate dynamic-column-width;}' + 
            '@keyframes dynamic-column-width { from {width: 500px;} to {width: 200px;} }' +
            '</style>' +
    '<foreignObject x="0" y="0" width="500" height="500" style="inline-size:500px;">' + 
        '<div xmlns="http://www.w3.org/1999/xhtml" class="container">' + 
            '<div style="text-align:left;">' + 
                'Dynamic column-width text layout demo' + 
            '</div>' + 
            '<div style="text-align:right;">' + 
                'عرض توضيلتخطيط النص بعرض أعمدة ديناميكي' + 
            '</div>' + 
        '</div>' + 
    '</foreignObject>' + 
    '</svg>';

        var DOMURL = window.URL || window.webkitURL || window;

        var img = new Image();
        var svg = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
        var url = DOMURL.createObjectURL(svg);

        img.onload = function () {
            ctx.drawImage(img, 0, 0);
            DOMURL.revokeObjectURL(url);
        }

        img.src = url;
    </script>
</body>
</html>
