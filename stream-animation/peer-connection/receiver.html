<!doctype html>
<head>
    <meta charset="utf-8">
    <title>Receiver, callee</title>
    <link rel="icon" type="image/png" sizes="128x128" href="favicon128.png">
    <style>
        canvas {
            background-color: #ccc;
            width: 320px;
            height: 180px;
        }

        video {
            width: 320px;
            height: 180px;
        }
    </style>
</head>
<h2>Mission control</h2>
<h3>Role: Receiver</h3>
<h3>Paste the "offer" you generated on Transmitter (XMIT) page</h3>
<div id="remoteOffer" contenteditable="true" style="min-height: 24px; height: fit-content; border: 1px solid"></div>
<button id="offerRecdBtn">Done!</button>
<h3 id="localAnswerLabel" hidden>=> Paste your local answer into 'Paste the "answer"...' control of XMIT's page'</h3>
<div id="localAnswer" style="height:fit-content; border: 1px solid"></div>
<em id="idPlacedToClipboard" hidden style="font-size:larger;">The text generated has been placed to your clipboard.</em>
<button id="copyToClipboard" disabled>Copy 'answer' to clipboard</button>.
<hr />
<video playsinline controls autoplay muted></video>
<hr />
Chat:
<br>
<div id="chatlog" style="height:200px; overflow:auto; border:1px solid"></div>
<br>
<input type="text" id="messageTextBox" placeholder="Type your message here">
<button id="sendMessageBtn" onclick="sendMessage()">Send message</button>
<script src="./receiver.js" async></script>
