<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Relativistic Kepler</title>
    <style>
        input[type="number"] {
            width:5em;
        }
    </style>
</head>
<body>
    <button onclick="motion_in_CoulombField()">draw trajectory in Coulomb Field</button>
    <label>Px</label><input type="number" id="idPx" value="1.2" step="0.1" />
    <label>Py</label><input type="number" id="idPy" value="0" step="0.1" />
    <label>Qx</label><input type="number" id="idQx" value="0" step="0.1" />
    <label>Qy</label><input type="number" id="idQy" value="0.9" step="0.1" />
    <label>Finish time</label><input type="number" id="idFintime" value="50" />
    <label>Timestep</label><input type="number" id="idTimestep" value="1E-4" step="1E-5"/>
    <div class="trajectory">
        <canvas width="1000" height="1000"></canvas>
    </div>
    <script src="main.js"></script>
</body>
</html>
