<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Chainlist simulation</title>
    <link rel="icon" type="image/png" sizes="128x128" href="favicon128.png">
    <style>
        input[type="number"] {
            width: 5em;
        }
    </style>
</head>
<body>
    <div>
        <select id="idNetlistSelect" size="8">
            <option value="netlistTriPend">Triple Pendulum</option>
            <option value="netlistChain">Chain</option>
            <option value="netlistSymPiston">Symmetric Piston</option>
            <option value="netlistAsymPiston">Asymmetric Piston</option>
            <option value="netlistSwing">Rubber Swing</option>
            <option value="netlist2p3bPend">2-pivot 3-bob Pendulum</option>
            <option value="netlist2p2bPend">2-pivot 2-bob Pendulum</option>
            <option value="netlistSoliton">Soliton</option>
        </select>
        <textarea id="idNetlist" style="width:360px; height:180px;"></textarea>
        <button onclick="tran()">Start simulation</button>
        <button id="idStop">Stop simulation</button>
    </div>
    <div style="width:1000px; border: 1px solid grey; background-color: indigo;">
        <canvas width="1000" height="1000"></canvas>
    </div>
    <script src="chainlistparser.js"></script>
    <script src="linalg.js"></script>
    <script src="main.js"></script>
</body>
</html>
